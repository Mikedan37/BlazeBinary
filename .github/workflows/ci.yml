name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
    - name: Build
      run: swift build
      
    - name: Run tests
      run: swift test
      
    - name: Check for warnings
      run: |
        swift build 2>&1 | grep -i "warning:" && exit 1 || exit 0
        swift test 2>&1 | grep -i "warning:" && exit 1 || exit 0

  benchmark:
    name: Run Benchmarks (Optional)
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
    - name: Run benchmarks
      run: swift run BlazeBinaryBenchmarks

