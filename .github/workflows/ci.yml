name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04]
        swift-version: ["5.9"]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.swift-version }}
    
    - name: Verify documentation files exist
      run: |
        echo "Checking for required documentation files..."
        test -f README.md || exit 1
        test -f LICENSE || exit 1
        test -f SECURITY.md || exit 1
        test -f CONTRIBUTING.md || exit 1
        test -f CHANGELOG.md || exit 1
        test -f Docs/SPECIFICATION.md || exit 1
        test -f Docs/ARCHITECTURE.md || exit 1
        test -f Docs/ENCODING_MODEL.md || exit 1
        test -f Docs/FRAME_PROTOCOL.md || exit 1
        test -f Docs/THREAT_MODEL.md || exit 1
        test -f Docs/BENCHMARKS.md || exit 1
        echo "All required documentation files exist"
    
    - name: Build
      run: swift build
    
    - name: Run tests
      run: swift test
    
    - name: Check for build artifacts
      run: |
        if [ -d ".build" ]; then
          echo "Build artifacts created successfully"
        else
          echo "Build artifacts not found"
          exit 1
        fi

  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Check README links
      run: |
        echo "Checking README.md for broken links..."
        # Basic check - ensure docs referenced in README exist
        grep -o '\[.*\](Docs/[^)]*)' README.md | sed 's/.*(\(.*\))/\1/' | while read link; do
          if [ ! -f "$link" ]; then
            echo "❌ Broken link: $link"
            exit 1
          fi
        done
        echo "All README links valid"
